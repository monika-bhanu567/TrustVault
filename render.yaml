services:
  - type: web
    name: trustvault-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: VAULT_ENCRYPTION_KEY
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: trustvault-encrypted
